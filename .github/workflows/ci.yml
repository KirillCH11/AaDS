name: "Build & Test"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-24.04]
        gcc_version: ["12"]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev libgmock-dev libeigen3-dev

      - name: Set up GCC ${{ matrix.gcc_version }}
        uses: Dup4/actions-setup-gcc@v1
        with:
          version: "${{ matrix.gcc_version }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Navigate to Assignment2
        run: |
          cd Assignment2 || { echo "::error::Directory Assignment2 not found"; ls -la; exit 1; }
          echo "WORKDIR=$(pwd)" >> $GITHUB_ENV

      - name: Build program
        run: |
          cd ${{ env.WORKDIR }}
          chmod +x build.sh
          ./build.sh

      - name: Run tests
        run: |
          cd ${{ env.WORKDIR }}
          chmod +x test.sh
          ./test.sh

      - name: Verify CSV I/O
        run: |
          cd ${{ env.WORKDIR }}
          ./gauss_solver --generate 5 test_system.csv
          ./gauss_solver test_system.csv test_solution.csv
          
          if [ ! -f "test_solution.csv" ]; then
            echo "::error::Solution file was not created"
            ls -la
            exit 1
          fi
          
          rm -f test_system.csv test_solution.csv
