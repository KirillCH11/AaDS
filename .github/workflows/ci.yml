name: "Build & Test"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: "repo"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev libgmock-dev libeigen3-dev

      - name: Clone CSV parser
        run: |
          git clone https://github.com/ben-strasser/fast-cpp-csv-parser.git repo/Assignment2/fast-cpp-csv-parser

      - name: Build and Test
        run: |
          cd repo/Assignment2 || { echo "::error::Directory structure:"; ls -R; exit 1; }
          
          g++ -std=c++17 -I. -I./fast-cpp-csv-parser -I/usr/include/eigen3 \
              main.cpp gauss_lib.cpp \
              -o gauss_solver
          
          g++ -std=c++17 -I. -I./fast-cpp-csv-parser -I/usr/include/eigen3 \
              gauss_tests.cpp gauss_lib.cpp \
              -lgtest -lgmock -lpthread \
              -o gauss_tests
          ./gauss_tests
          
          ./gauss_solver --generate 5 test_system.csv
          ./gauss_solver test_system.csv test_solution.csv
          [ -f "test_solution.csv" ] || { echo "::error::Solution file not created"; exit 1; }
          rm -f test_system.csv test_solution.csv
