name: "Build & Test"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev cmake

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          make clean
          make test
          ./test_decoder

      - name: Manual decoding test
        run: |
          make
          echo "Тест ручного ввода:"
          echo -e "0 10 110 0 1110 0 1111 0 10 110 0\n\na:0\nb:10\nr:110\nc:1110\nd:1111\n" > input.txt
          < input.txt
          [ $? -eq 0 ] || exit 1
          [ -f decoded.txt ] && grep -q "abracadabra" decoded.txt || exit 1
          echo "Ручной тест пройден!"
