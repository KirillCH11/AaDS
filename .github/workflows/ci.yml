name: "Build & Test"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-24.04]
        gcc_version: ["12"]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: "Assignment2"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libeigen3-dev \
            libgtest-dev \
            libgmock-dev \
            cmake

      - name: Setup GCC ${{ matrix.gcc_version }}
        uses: matrix-org/setup-gcc@v1
        with:
          version: "${{ matrix.gcc_version }}"

      - name: Clone CSV parser
        run: |
          cd Assignment2
          git clone https://github.com/ben-strasser/fast-cpp-csv-parser.git

      - name: Build program
        run: |
          cd Assignment2
          g++ -std=c++17 -I. -I./fast-cpp-csv-parser -I/usr/include/eigen3 \
              main.cpp gauss_lib.cpp \
              -o gauss_solver

      - name: Run tests
        run: |
          cd Assignment2
          g++ -std=c++17 -I. -I./fast-cpp-csv-parser -I/usr/include/eigen3 \
              gauss_tests.cpp gauss_lib.cpp \
              -lgtest -lgmock -lpthread \
              -o gauss_tests
          ./gauss_tests

      - name: Integration test
        run: |
          cd Assignment2
          ./gauss_solver --generate 5 test_system.csv
          ./gauss_solver test_system.csv solution.csv
          
          if [ ! -f "solution.csv" ]; then
            echo "::error::Solution file not created!"
            exit 1
          fi
          
          LINES=$(wc -l < solution.csv)
          if [ "$LINES" -ne 5 ]; then
            echo "::error::Incorrect solution size!"
            exit 1
          fi
          
          rm -f test_system.csv solution.csv
